# Caliper user configuration template (FR-11).
#
# Copy to `caliper.toml` at the repo root and edit. Version presets
# (configs/v1.toml, v2.toml, v3.toml) are merged UNDER this file, so values
# set here win — that is how you switch provider/model (e.g. to Ollama per
# assumption A2) without editing the committed presets.
#
# Paths, provider selection, and secrets are environment variables, not TOML
# (§11.2): CALIPER_PROVIDER, CALIPER_DB, CALIPER_CACHE_DIR, GEMINI_API_KEY...

[answer]
# Fixed answerer — identical across V1/V2/V3 (FR-10). Override only when
# switching provider (a new fingerprint and re-run follows by design, FR-09).
model = "gemini-3.5-flash-lite"
temperature = 0.0
seed = 42
# Initial 0.35; re-verified once against V1 eval data, then frozen (§7.7, §9.7).
refusal_threshold = 0.35
high_confidence_threshold = 0.60
# SHA-256 of the frozen prompt template (src/caliper/answer/prompt_template.md),
# frozen by T11; changing it changes the fingerprint (§11.2).
prompt_template_sha256 = "42c34ee58602c6c012d716eb952ed52a2664b8f89023892fca3155db91a9350d"

[embeddings]
model = "gemini-embedding-001"
dimensions = 768

[chunking]
unit = "heading" # "heading" (V1) or "fixed" (V2/V3)
size_tokens = 800
overlap_tokens = 0

[retrieval]
mode = "vector" # "vector" (V1/V2) or "hybrid_rrf" (V3)
vector_top_k = 5
fts_top_k = 0 # must be 0 when mode = "vector"
rrf_k = 60
rerank = "none" # "cross-encoder" (V3 only)
final_k = 5
