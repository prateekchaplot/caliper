# V3 preset — improved retrieval/ranking: hybrid RRF fusion + cross-encoder
# rerank (§9.7, ADR-006/ADR-011). Chunking identical to V2; answerer unchanged.

[answer]
model = "gemini-3.5-flash-lite"
temperature = 0.0
seed = 42
refusal_threshold = 0.35 # initial; re-verified once against V1 data, then frozen
high_confidence_threshold = 0.60
prompt_template_sha256 = "42c34ee58602c6c012d716eb952ed52a2664b8f89023892fca3155db91a9350d" # frozen by T11; changing it changes the fingerprint (§11.2)

[embeddings]
model = "gemini-embedding-001"
dimensions = 768

[chunking]
unit = "fixed"
size_tokens = 350
overlap_tokens = 50

[retrieval]
mode = "hybrid_rrf"
vector_top_k = 20
fts_top_k = 20
rrf_k = 60
rerank = "cross-encoder" # optional dependency group "rerank" (§5)
final_k = 5
